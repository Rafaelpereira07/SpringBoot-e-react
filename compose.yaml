services:
  mysql:
    image: mysql:8.4
    container_name: devpath-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: online_course
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: devpath-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/workspace
    working_dir: /workspace
    command: sh -c "./mvnw spring-boot:run --no-transfer-progress"
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /workspace
          ignore:
            - target/
            - .git/
            - .idea/
            - .vscode/
    stdin_open: true
    tty: true

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
      args:
        VITE_API_URL: http://localhost:8080
    container_name: devpath-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node_modules:/app/node_modules
    working_dir: /app
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 5173"
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .git/
            - .idea/
            - .vscode/
    stdin_open: true
    tty: true

volumes:
  mysql-data:
  frontend-node_modules:
