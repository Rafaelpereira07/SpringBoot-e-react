services:
  mysql:
    image: mysql:8.4
    container_name: backend-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: online_course
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      target: dev
    container_name: backend-dev
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: sh -c "./mvnw spring-boot:run --no-transfer-progress"

volumes:
  mysql-data:
